---
name: Run Unit Tests

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
    tags:
      - v*.*

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    name: Run Unit Tests
    strategy:
      matrix:
        platform: ['chrome', 'firefox']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare manifest.json
        run: cp src/manifest-${{ matrix.platform }}.json src/manifest.json

      - name: Build Docker images
        run: |
          docker compose build

      - name: Run Unit Tests
        run: |
          docker run \
            --rm \
            -v $(pwd):/app:delegated \
            -v /app/node_modules \
            screenly-browser-extension:latest \
            /bin/bash -c "bunx webpack --config webpack.dev.js && bun run test"
